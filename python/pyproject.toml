[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gearbit"
version = "0.1.0"
description = "Управление роботом через Gearbit: robot.forward(50), robot.distance(\"front\")"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "EugeneSoftwareDeveloper" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/EugeneSoftwareDeveloper/Gearbit"

[tool.setuptools]
packages = ["gearbit"]
