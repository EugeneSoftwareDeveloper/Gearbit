<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Gearbit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Тема применяется до отрисовки, чтобы не было вспышки светлого экрана ночью.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("gearbit.settings") || "{}");
          var mode = s.theme || "system";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.accent = s.accent || "ocean";
          if (s.largeText) document.documentElement.dataset.large = "true";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
